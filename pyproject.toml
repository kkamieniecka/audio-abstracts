[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-abstracts"
version = "0.1.0"
description = "Read research abstracts aloud with ElevenLabs, with the jargon pronounced correctly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Katarzyna Kamieniecka" }]
keywords = ["elevenlabs", "text-to-speech", "accessibility", "bioinformatics", "pronunciation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
sdk = ["elevenlabs>=1.0"]

[project.scripts]
audio-abstracts = "audio_abstracts.cli:main"

[project.urls]
Homepage = "https://github.com/kkamieniecka/audio-abstracts"
Tutorial = "https://github.com/kkamieniecka/audio-abstracts/blob/main/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_abstracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
